# Builds the iPhone app (ios/) on GitHub's macOS machines: the server this project is developed on has no
# Xcode. Every push that touches the app compiles it for the simulator. The TestFlight upload runs only on
# main and on a manual run, and only when the repository has its signing secrets (see ios/README.md).
name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the build to TestFlight"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen --version

      - name: Generate the project
        working-directory: ios
        run: xcodegen generate

      - name: Build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project PersonalContentCloud.xcodeproj -scheme PersonalContentCloud \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/build.log | xcbeautify --renderer github-actions

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build/build.log
          if-no-files-found: ignore
          retention-days: 7
