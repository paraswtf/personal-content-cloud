# Builds and tests the iPhone app (ios/) on GitHub's macOS machines: the server this project is developed
# on has no Xcode. Every push that touches the app compiles it, starts the backend on the runner with the
# models off and a made-up library (ios/ci/seed_server.py), runs the unit tests and the screen tests
# against it on a simulator, and keeps the screenshots as the "screenshots" artifact (ios/README.md,
# "Tests on GitHub"). Nothing here talks to a real server or to anyone's photos.
name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the build to TestFlight"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PCC_PORT: "8765"
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen --version

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Generate the project
        working-directory: ios
        run: xcodegen generate

      - name: Pick and boot a simulator
        run: |
          read -r SIM_ID SIM_NAME SIM_OS < <(xcrun simctl list devices available -j | python3 ios/ci/pick_simulator.py)
          test -n "$SIM_ID"
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          echo "Simulator: $SIM_NAME on $SIM_OS ($SIM_ID)"
          xcrun simctl boot "$SIM_ID" || true

      - name: Build for testing
        working-directory: ios
        run: |
          mkdir -p build
          xcodebuild -project PersonalContentCloud.xcodeproj -scheme PersonalContentCloud \
            -destination "id=$SIM_ID" -derivedDataPath build/dd \
            build-for-testing 2>&1 | tee build/build.log | xcbeautify --renderer github-actions

      - name: Install the backend
        run: ios/ci/install_backend.sh "$RUNNER_TEMP/pcc-venv"

      - name: Seed and start the backend
        run: |
          P="$RUNNER_TEMP/pcc"
          mkdir -p "$P/data" "$P/originals" "$P/backup" "$P/models" "$P/no-frontend"
          export DATA_DIR="$P/data" ORIGINALS_DIR="$P/originals" BACKUP_DIR="$P/backup" MODELS_DIR="$P/models" \
            FRONTEND_DIST="$P/no-frontend" PCC_NO_MODELS=1 MIN_FREE_DISK_MB=64
          echo "PCC_DIR=$P" >> "$GITHUB_ENV"
          cd backend
          "$RUNNER_TEMP/pcc-venv/bin/python" ../ios/ci/seed_server.py library
          nohup "$RUNNER_TEMP/pcc-venv/bin/uvicorn" --factory app.main:create_app --host 127.0.0.1 --port "$PCC_PORT" \
            > "$P/backend.log" 2>&1 &
          echo $! > "$P/backend.pid"
          "$RUNNER_TEMP/pcc-venv/bin/python" ../ios/ci/seed_server.py api --server "http://127.0.0.1:$PCC_PORT" \
            --out "$P/seed.json" | grep -v '"token"'

      - name: Run the tests
        working-directory: ios
        run: |
          SERVER="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["server"])' "$PCC_DIR/seed.json")"
          TOKEN="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["token"])' "$PCC_DIR/seed.json")"
          echo "::add-mask::$TOKEN"
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl privacy "$SIM_ID" grant photos in.rivant.pcc || true
          TEST_RUNNER_PCC_TEST_SERVER="$SERVER" TEST_RUNNER_PCC_TEST_TOKEN="$TOKEN" \
          xcodebuild -project PersonalContentCloud.xcodeproj -scheme PersonalContentCloud \
            -destination "id=$SIM_ID" -derivedDataPath build/dd -resultBundlePath build/Tests.xcresult \
            test-without-building 2>&1 | tee build/test.log | xcbeautify --renderer github-actions

      - name: Export the screenshots
        if: always()
        run: python3 ios/ci/export_screenshots.py ios/build/Tests.xcresult ios/build/screenshots

      - name: Stop the backend
        if: always()
        run: |
          if [ -f "${PCC_DIR:-/nonexistent}/backend.pid" ]; then kill "$(cat "$PCC_DIR/backend.pid")" || true; fi

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ios/build/screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            ios/build/build.log
            ios/build/test.log
            ${{ runner.temp }}/pcc/backend.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: ios/build/Tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
