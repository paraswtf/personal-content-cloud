[project]
name = "personal-content-cloud"
version = "0.1.0"
description = "Personal Content Cloud: single-user photo, video and document cloud with local ML indexing"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "onnxruntime-gpu[cuda,cudnn]>=1.22",
    "pillow>=11.0",
    "pillow-heif>=0.20",
    "rawpy>=0.25",
    "tokenizers>=0.20",
    "pypdfium2>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "rapidocr>=3.0",
    "zxing-cpp>=2.3",
    "webauthn>=3.0",
    "argon2-cffi>=23.1",
    "cryptography>=43",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep the temp dirs of failed tests only: a passing full run used to leave about 0.5 GB behind (x3).
tmp_path_retention_policy = "failed"
pythonpath = ["."]
